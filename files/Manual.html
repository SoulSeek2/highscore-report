<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Screenshot Matchup & DB Tool</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      max-width: 680px;
      margin: 0 auto;
    }
    
    .toolbar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);          
      gap: 10px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .btn {
      background: #238636;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid #2ea043;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover { background: #2ea043; }
    .btn-secondary { background: #21262d; border-color: #30363d; color: #c9d1d9; }
    .btn-secondary:hover { background: #30363d; color: #58a6ff; }
    .btn-accent { background: #1f6feb; border-color: #388bfd; }
    .btn-accent:hover { background: #388bfd; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    h2 { font-size: 16px; color: #58a6ff; margin-bottom: 10px; font-weight: 700; }

    /* Comparison Table Styling */
    .results-table {
      width: 100%;
      border-collapse: collapse;
      background: #161b22;
      border-radius: 8px;
      overflow: hidden;
      font-size: 13px;
      margin-bottom: 14px;
      border: 1px solid #30363d;
    }

    .results-table th, .results-table td {
      padding: 8px 8px;
      text-align: center;
      border-bottom: 1px solid #21262d;
    }

    .results-table th { background: #161b22; color: #8b949e; }
    .winner { color: #3fb950; font-weight: bold; background: rgba(63, 185, 80, 0.15); }
    .loser { color: #f85149; }

    .compare-wrapper {
      display: flex;
      flex-direction: row;
      gap: 10px;
      margin-bottom: 14px;
    }

    .player-col {
      flex: 1;
      min-width: 0;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .player-col h3 {
      font-size: 12px;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #58a6ff;
    }

    .player-col img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      display: block;
      margin-bottom: 6px;
    }

    #status {
      text-align: center;
      font-size: 13px;
      color: #8b949e;
      margin: 10px 0;
    }

    .db-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8b949e;
    }

    .date-input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="db-status-bar">
      <span id="dbLoadedBadge">📁 Loading database.json...</span>
      <div>
        <label style="font-size:12px; margin-right:6px; color:#8b949e;">Date:</label>
        <input type="date" id="matchDate" class="date-input">
      </div>
    </div>
  </div>

  <div class="toolbar">
    <label class="btn" for="fileSelect">📸 Select 2 Screenshots</label>
    <input type="file" id="fileSelect" multiple style="display:none">

    <label class="btn btn-secondary" for="dbSelect">📂 Load database.json</label>
    <input type="file" id="dbSelect" accept=".json" style="display:none">

    <a href="generate_thumbs.html" class="btn btn-secondary">🖼️ View Thumbnail Generator</a>
    <a href="index.html" class="btn btn-secondary">📊 View Report App</a>
  </div>

  <div id="status">Select 2 screenshots to run OCR and merge into database...</div>

  <div id="ocrResults"></div>
  <div class="compare-wrapper" id="imageContainer"></div>

  <div id="saveCard" class="card" style="display:none; text-align:center;">
    <h2>💾 Merge & Save Options</h2>
    <p style="font-size:12px; color:#8b949e; margin-bottom:12px;">
      Thumbnails and comparison log generated successfully. Save updated database.json below.
    </p>
    <div class="toolbar">
      <button id="mergeSaveBtn" class="btn btn-accent">💾 Save / Export database.json</button>
      <button id="dlThumbThomasBtn" class="btn btn-secondary" style="display:none;">📥 Download Thomas Thumb</button>
      <button id="dlThumbDaniBtn" class="btn btn-secondary" style="display:none;">📥 Download Dani Thumb</button>
    </div>
  </div>

  <script>
    const MY_NAME = "Thomas";
    const SISTER_NAME = "Dani";
    const CATEGORY_NAMES = ["Zip", "Gems", "Lotus", "Panda", "Libra", "Sums", "Hashi"];
    const LEGACY_CATEGORY_NAMES = ["Zip", "Lotus", "Panda", "Libra", "Sums", "Hashi"];

    function getCategoryNamesForDate(dateKey) {
      if (dateKey && dateKey < "2026-09-26") {
        return LEGACY_CATEGORY_NAMES;
      }
      return CATEGORY_NAMES;
    }

    function getTimeForSlot(slotIndex, timesList, dateKey) {
      return timesList[slotIndex] || { raw: "N/A", seconds: Infinity };
    }

    let loadedDb = {};
    let currentSessionData = null;

    const fileSelect = document.getElementById('fileSelect');
    const dbSelect = document.getElementById('dbSelect');
    const imageContainer = document.getElementById('imageContainer');
    const ocrResults = document.getElementById('ocrResults');
    const status = document.getElementById('status');
    const matchDateInput = document.getElementById('matchDate');
    const dbLoadedBadge = document.getElementById('dbLoadedBadge');
    const saveCard = document.getElementById('saveCard');
    const mergeSaveBtn = document.getElementById('mergeSaveBtn');
    const dlThumbThomasBtn = document.getElementById('dlThumbThomasBtn');
    const dlThumbDaniBtn = document.getElementById('dlThumbDaniBtn');

    // Set today as default date
    const todayStr = new Date().toISOString().split('T')[0];
    matchDateInput.value = todayStr;

    // 1. Auto-fetch database.json
    async function loadInitialDb() {
      try {
        const res = await fetch('database.json?cache=' + Date.now());
        if (res.ok) {
          loadedDb = await res.json();
          dbLoadedBadge.textContent = `✅ database.json loaded (${Object.keys(loadedDb).length} entries)`;
        } else {
          dbLoadedBadge.textContent = "⚠️ Could not auto-fetch database.json. Click 'Load database.json' to select manually.";
        }
      } catch (e) {
        dbLoadedBadge.textContent = "ℹ️ Offline mode: Click 'Load database.json' to upload your database file.";
      }
    }
    loadInitialDb();

    dbSelect.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        loadedDb = JSON.parse(text);
        dbLoadedBadge.textContent = `✅ Loaded ${file.name} (${Object.keys(loadedDb).length} entries)`;
      } catch (err) {
        alert("Invalid database.json file!");
      }
    });

    fileSelect.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));

      if (files.length !== 2) {
        status.textContent = "Error: Please select exactly 2 screenshots.";
        return;
      }

      status.textContent = "Analyzing image dimensions & mapping owners...";

      try {
        const imgInfo1 = await getImageDimensions(files[0]);
        const imgInfo2 = await getImageDimensions(files[1]);

        let myFile, sisterFile, myHeight, sisterHeight;

        if (imgInfo1.height > imgInfo2.height) {
          sisterFile = files[0]; sisterHeight = imgInfo1.height;
          myFile = files[1]; myHeight = imgInfo2.height;
        } else if (imgInfo2.height > imgInfo1.height) {
          sisterFile = files[1]; sisterHeight = imgInfo2.height;
          myFile = files[0]; myHeight = imgInfo1.height;
        } else {
          myFile = files[0]; myHeight = imgInfo1.height;
          sisterFile = files[1]; sisterHeight = imgInfo2.height;
        }

        // Generate Thumbnails in browser via Canvas
        const thumbMy = await generateCanvasThumbnail(myFile);
        const thumbSis = await generateCanvasThumbnail(sisterFile);

        const timestamp = Date.now();
        const myImgName = `compiled_${timestamp}_thomas.png`;
        const sisterImgName = `compiled_${timestamp}_dani.png`;

        const myThumbName = `thumb_compiled_${timestamp}_thomas.jpg`;
        const sisterThumbName = `thumb_compiled_${timestamp}_dani.jpg`;

        imageContainer.innerHTML = `
          <div class="player-col">
            <h3>${MY_NAME} (${myHeight}px)</h3>
            <img src="${URL.createObjectURL(myFile)}">
            <p style="font-size:11px; color:#8b949e;">Thumbnail generated</p>
          </div>
          <div class="player-col">
            <h3>${SISTER_NAME} (${sisterHeight}px)</h3>
            <img src="${URL.createObjectURL(sisterFile)}">
            <p style="font-size:11px; color:#8b949e;">Thumbnail generated</p>
          </div>
        `;

        status.textContent = "Cropping times & running OCR engine...";

        const processedCanvasMy = await preprocessImage(myFile);
        const processedCanvasSister = await preprocessImage(sisterFile);

        const timesMy = await ocrRowTimesFromCanvas(processedCanvasMy);
        const timesSister = await ocrRowTimesFromCanvas(processedCanvasSister);

        status.textContent = "Success! Comparison calculated below.";
        renderComparisonTable(timesMy, timesSister, MY_NAME, SISTER_NAME);

        // Prepare session object for merging
        currentSessionData = {
          date: matchDateInput.value || todayStr,
          created_at: new Date().toLocaleString(),
          thomas: {
            name: MY_NAME,
            screenshot: `Images/${myImgName}`,
            thumbnail: `Thumbnails/${myThumbName}`,
            times: timesMy
          },
          dani: {
            name: SISTER_NAME,
            screenshot: `Images/${sisterImgName}`,
            thumbnail: `Thumbnails/${sisterThumbName}`,
            times: timesSister
          },
          thumbBlobs: {
            thomasName: myThumbName,
            thomasBlob: thumbMy.blob,
            daniName: sisterThumbName,
            daniBlob: thumbSis.blob
          }
        };

        saveCard.style.display = 'block';
        setupThumbnailDownloads(currentSessionData.thumbBlobs);

      } catch (err) {
        console.error(err);
        status.textContent = "Error during image processing or OCR execution.";
      }
    });

    function generateCanvasThumbnail(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 400;
          const ratio = maxW / img.width;
          canvas.width = maxW;
          canvas.height = img.height * ratio;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(blob => {
            resolve({ blob, dataUrl: canvas.toDataURL('image/jpeg', 0.8) });
          }, 'image/jpeg', 0.8);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    function setupThumbnailDownloads(thumbInfo) {
      dlThumbThomasBtn.style.display = 'inline-flex';
      dlThumbDaniBtn.style.display = 'inline-flex';

      dlThumbThomasBtn.onclick = () => downloadBlob(thumbInfo.thomasBlob, thumbInfo.thomasName);
      dlThumbDaniBtn.onclick = () => downloadBlob(thumbInfo.daniBlob, thumbInfo.daniName);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    mergeSaveBtn.onclick = async () => {
      if (!currentSessionData) return;

      const sessionDate = currentSessionData.date;
      recalculateEntry(currentSessionData);

      // Merge into loadedDb
      loadedDb[sessionDate] = {
        date: sessionDate,
        created_at: currentSessionData.created_at,
        summary: currentSessionData.summary,
        thomas: currentSessionData.thomas,
        dani: currentSessionData.dani,
        rows: currentSessionData.rows
      };

      const jsonText = JSON.stringify(loadedDb, null, 2);

      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'database.json',
            types: [{ description: 'JSON Database File', accept: { 'application/json': ['.json'] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(jsonText);
          await writable.close();
          alert("✅ Merged session and saved database.json successfully!");
          return;
        } catch (err) {
          console.log("Picker cancelled or unsupported, downloading file.");
        }
      }

      const blob = new Blob([jsonText], { type: 'application/json' });
      downloadBlob(blob, 'database.json');
      alert("✅ Merged session! Saved database.json download. Save it into your files/ directory.");
    };

    function recalculateEntry(entry) {
      const tTimes = entry.thomas.times;
      const dTimes = entry.dani.times;
      const categoryNames = getCategoryNamesForDate(entry.date);
      const maxRows = Math.max(tTimes.length, dTimes.length, categoryNames.length);
      let tWins = 0, dWins = 0;
      entry.rows = [];

      for (let i = 0; i < maxRows; i++) {
        const cat = categoryNames[i] || `Cat ${i+1}`;
        const tObj = getTimeForSlot(i, tTimes, entry.date);
        const dObj = getTimeForSlot(i, dTimes, entry.date);

        let diff = "N/A", winner = "none";

        if (tObj.seconds !== Infinity && dObj.seconds !== Infinity) {
          if (tObj.seconds < dObj.seconds) {
            diff = `Thomas won by ${dObj.seconds - tObj.seconds}s`;
            winner = "thomas";
            tWins++;
          } else if (dObj.seconds < tObj.seconds) {
            diff = `Dani won by ${tObj.seconds - dObj.seconds}s`;
            winner = "dani";
            dWins++;
          } else {
            diff = "Tie";
            winner = "tie";
          }
        }

        entry.rows.push({
          category: cat,
          thomas_raw: tObj.raw,
          dani_raw: dObj.raw,
          diff: diff,
          winner: winner
        });
      }
      entry.summary = `Thomas ${tWins} - ${dWins} Dani`;
    }

    function getImageDimensions(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ width: img.width, height: img.height, file });
        img.src = URL.createObjectURL(file);
      });
    }

    function preprocessImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const cropX = img.width * 0.47;
          const cropY = img.height * 0.16;
          const cropW = img.width * 0.51;
          const cropH = img.height * 0.77;
          const maxTargetWidth = 420;
          const scale = maxTargetWidth / cropW;

          canvas.width = maxTargetWidth;
          canvas.height = cropH * scale;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'medium';
          ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

          const gray = document.createElement('canvas');
          gray.width = canvas.width;
          gray.height = canvas.height;
          const gctx = gray.getContext('2d');
          gctx.drawImage(canvas, 0, 0);
          const imageData = gctx.getImageData(0, 0, gray.width, gray.height);
          const data = imageData.data;
          for (let i = 0; i < data.length; i += 4) {
            const luminance = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
            const bin = luminance > 180 ? 255 : 0;
            data[i] = bin; data[i + 1] = bin; data[i + 2] = bin;
          }
          gctx.putImageData(imageData, 0, 0);
          resolve(gray);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    function parseTimeTokensFromText(text) {
      const values = [];
      const normalized = (text || '').replace(/\r/g, ' ').replace(/\s+/g, ' ');
      const matches = [...normalized.matchAll(/(\d+\s*:\s*\d{1,2}\s*(?:s|min|m)?)/gi)];

      for (const match of matches) {
        const raw = match[1].trim();
        const clean = raw.replace(/\s+/g, '').toLowerCase();
        const m = clean.match(/^(\d+):(\d{1,2})(s|min|m)?$/);
        if (!m) continue;

        const minutes = Number(m[1]);
        const seconds = Number(m[2]);
        const totalSeconds = minutes * 60 + seconds;

        if (Number.isFinite(totalSeconds) && totalSeconds >= 1 && totalSeconds <= 3600) {
          values.push({ raw: raw, seconds: totalSeconds });
        }
      }

      return values;
    }

    function pickBestTimeToken(tokens) {
      if (!tokens || !tokens.length) return null;

      const valid = tokens.filter(v => v.seconds > 0 && v.seconds <= 3600);
      if (!valid.length) return null;

      const nonTiny = valid.filter(v => v.seconds >= 10);
      if (nonTiny.length) {
        return nonTiny.reduce((best, cur) => cur.seconds > best.seconds ? cur : best, nonTiny[0]);
      }

      return valid.reduce((best, cur) => cur.seconds > best.seconds ? cur : best, valid[0]);
    }

    async function ocrRowTimesFromCanvas(canvas) {
      const worker = await Tesseract.createWorker('eng');
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789:sminSMIN\n ',
        tessedit_pageseg_mode: '7',
        preserve_interword_spaces: '1'
      });

      const rowCount = 7;
      const values = [];

      for (let i = 0; i < rowCount; i++) {
        const y0 = Math.floor((canvas.height / rowCount) * i);
        const y1 = Math.floor((canvas.height / rowCount) * (i + 1));
        const rowTop = Math.max(0, y0 + 8);
        const rowBottom = Math.max(rowTop + 12, y1 - 8);

        const rowCanvas = document.createElement('canvas');
        rowCanvas.width = Math.max(60, Math.floor(canvas.width * 0.7));
        rowCanvas.height = Math.max(1, rowBottom - rowTop);

        const ctx = rowCanvas.getContext('2d');
        ctx.clearRect(0, 0, rowCanvas.width, rowCanvas.height);
        ctx.filter = 'grayscale(1) contrast(180%) brightness(120%)';
        ctx.drawImage(
          canvas,
          Math.floor(canvas.width * 0.12),
          rowTop,
          Math.floor(canvas.width * 0.72),
          Math.max(1, rowBottom - rowTop),
          0,
          0,
          rowCanvas.width,
          rowCanvas.height
        );
        ctx.filter = 'none';

        const res = await worker.recognize(rowCanvas);
        const rowValues = parseTimeTokensFromText(res.data.text);
        const selected = pickBestTimeToken(rowValues);
        if (selected) {
          values.push(selected);
        }
      }

      await worker.terminate();
      return values.slice(0, 7);
    }

    function renderComparisonTable(tMy, tSis, p1Name, p2Name) {
      let rows = '';
      const categoryNames = getCategoryNamesForDate(matchDateInput.value || todayStr);
      const maxRows = Math.max(tMy.length, tSis.length, categoryNames.length);

      for (let i = 0; i < maxRows; i++) {
        const itemMy = tMy[i] || { raw: 'N/A', seconds: Infinity };
        const itemSis = tSis[i] || { raw: 'N/A', seconds: Infinity };
        const categoryName = categoryNames[i] || `Cat ${i + 1}`;

        let diff = '', cMy = '', cSis = '';

        if (itemMy.raw === 'N/A' || itemSis.raw === 'N/A' || itemMy.seconds === null || itemSis.seconds === null) {
          diff = 'N/A';
        } else if (itemMy.seconds < itemSis.seconds) {
          diff = `${p1Name} won by ${(itemSis.seconds - itemMy.seconds)}s`;
          cMy = 'winner';
          cSis = 'loser';
        } else if (itemSis.seconds < itemMy.seconds) {
          diff = `${p2Name} won by ${(itemMy.seconds - itemSis.seconds)}s`;
          cMy = 'loser';
          cSis = 'winner';
        } else {
          diff = 'Tie';
        }

        rows += `
        <tr>
            <td style="font-weight:600; text-align:left; padding-left:12px;">${categoryName}</td>
            <td class="${cMy}">${itemMy.raw}</td>
            <td class="${cSis}">${itemSis.raw}</td>
            <td>${diff}</td>
        </tr>
        `;
      }

      ocrResults.innerHTML = `
        <table class="results-table">
        <thead>
            <tr>
            <th style="text-align:left; padding-left:12px;">Category</th>
            <th>${p1Name}</th>
            <th>${p2Name}</th>
            <th>Margin</th>
            </tr>
        </thead>
        <tbody>${rows}</tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
