<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thumbnail Creator</title>

<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #0d1117;
  color: #e6edf3;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 14px;
  max-width: 680px;
  margin: 0 auto;
}

.toolbar {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.toolbar-wide {
  grid-column: 1 / -1;
}

.btn {
  background: #238636;
  color: white;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  border: 1px solid #2ea043;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
}

.btn:hover {
  background: #2ea043;
}

.btn-secondary {
  background: #21262d;
  border-color: #30363d;
  color: #c9d1d9;
}

.btn-secondary:hover {
  background: #30363d;
  color: #58a6ff;
}

.card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 14px;
}

h2 {
  font-size: 16px;
  color: #58a6ff;
  margin-bottom: 10px;
}

input[type=file] {
  display: none;
}

.thumb {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 14px;
}

.thumb img {
  width: 100%;
  max-width: 400px;
  height: auto;
  display: block;
  border-radius: 6px;
  margin: 10px 0;
}

.thumb-name {
  font-size: 13px;
  color: #8b949e;
  word-break: break-all;
}

#status {
  text-align: center;
  font-size: 13px;
  color: #8b949e;
  margin: 10px 0;
}
</style>

</head>

<body>

<div class="card">

  <h2>🖼️ Thumbnail Creator</h2>

  <div class="toolbar">

    <label class="btn btn-secondary toolbar-wide" for="files" >
      📂📸 Select Images
    </label>

    <input type="file" id="files" multiple>

    <a href="Manual.html" class="btn btn-secondary">
      📸 OCR Tool
    </a>

    <a href="index.html" class="btn btn-secondary">
      📊 View Report App
    </a>

  </div>

  <button class="btn" style="width:100%;" onclick="createThumbs()">
    ✨ Create Thumbnails
  </button>

</div>


<div id="status"></div>

<div id="output"></div>


<script>

async function createThumbs() {

    const output = document.getElementById("output");
    const status = document.getElementById("status");

    output.innerHTML = "";

    const files = document.getElementById("files").files;

    if (!files.length) {
        alert("Select images first");
        return;
    }


    const maxWidth = 400;
    const quality = 0.80;

    let count = 0;


    for (const file of files) {

        const img = await loadImage(file);

        const ratio = maxWidth / img.width;

        const width = maxWidth;
        const height = Math.round(img.height * ratio);


        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;


        const ctx = canvas.getContext("2d");

        ctx.drawImage(
            img,
            0,
            0,
            width,
            height
        );


        const blob = await new Promise(resolve =>
            canvas.toBlob(
                resolve,
                "image/jpeg",
                quality
            )
        );


        const filename =
            "thumb_" +
            file.name.replace(/\.[^/.]+$/, "") +
            ".jpg";


        const url = URL.createObjectURL(blob);


        const div = document.createElement("div");

        div.className = "thumb";


        div.innerHTML = `
            <div class="thumb-name">${filename}</div>
            <img src="${url}" loading="lazy">
        `;


        const button = document.createElement("button");

        button.className = "btn btn-secondary";
        button.textContent = "📥 Download";


        button.onclick = () => {

            const a = document.createElement("a");

            a.href = url;
            a.download = filename;

            a.click();

        };


        div.appendChild(button);

        output.appendChild(div);


        count++;

        status.textContent =
            `Created ${count}/${files.length}`;

    }

}


function loadImage(file) {

    return new Promise(resolve => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.src = URL.createObjectURL(file);

    });

}

</script>

</body>
</html>
